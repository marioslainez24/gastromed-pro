name: Construir GastroMedPro.exe

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: write   # para publicar el .exe en «Releases»

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar componentes
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "pyinstaller>=6.10,<7"

      - name: Pruebas automáticas en Windows
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Construir el ejecutable
        working-directory: build
        run: pyinstaller --noconfirm --clean GastroMedPro.spec

      - name: Probar el ejecutable (flujo completo)
        run: python build/smoke_exe.py build/dist/GastroMedPro.exe

      - name: Publicar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: GastroMedPro-exe
          path: build/dist/GastroMedPro.exe
          retention-days: 30

      - name: Publicar versión descargable (Releases)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('app/__init__.py', encoding='utf-8').read()).group(1))")
          TAG="v${VER}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/dist/GastroMedPro.exe --title "GastroMed Pro ${VER} (compilación ${GITHUB_RUN_NUMBER})" \
            --notes "Ejecutable para Windows probado automáticamente en Windows: pruebas del programa y flujo completo (configuración inicial, paciente, nota, receta PDF, respaldo). Descargue GastroMedPro.exe."
