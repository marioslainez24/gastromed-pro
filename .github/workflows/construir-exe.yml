name: Construir GastroMedPro (Windows; Mac solo cuando se pida)

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:   # prueba manual (desde «desarrollo» construye y prueba, pero NO publica)
    inputs:
      mac:
        description: "Construir también la versión para Mac"
        type: boolean
        default: false

permissions:
  contents: write   # para publicar en «Releases»

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar componentes
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "pyinstaller>=6.10,<7"

      - name: Pruebas automáticas en Windows
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Construir el ejecutable
        working-directory: build
        run: pyinstaller --noconfirm --clean GastroMedPro.spec

      - name: Probar el ejecutable (flujo completo)
        env:
          GM_LICENCIA_CLAVE: ${{ secrets.GM_LICENCIA_CLAVE }}
        run: python build/smoke_exe.py build/dist/GastroMedPro.exe

      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: GastroMedPro-exe
          path: build/dist/GastroMedPro.exe
          retention-days: 30

  mac:
    # Pedido del Dr. Lainez (3-nov-2026): la versión para Mac se hace SOLO cuando se pida. Se activa con «[mac]» en el mensaje del
    # último commit que llega a main, o a mano (workflow_dispatch con mac = true). Las demás publicaciones son solo para Windows.
    if: ${{ contains(github.event.head_commit.message, '[mac]') || (github.event_name == 'workflow_dispatch' && inputs.mac) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14           # Mac con chip Apple (M1, M2, M3, M4…); hecho en macOS 14 sirve también para 15 y 26
            nombre: GastroMedPro-Mac-chip-Apple
          - runner: macos-15-intel     # Mac con procesador Intel
            nombre: GastroMedPro-Mac-Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar componentes
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "pyinstaller>=6.10,<7"

      - name: Pruebas automáticas en Mac
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Construir el programa
        working-directory: build
        run: pyinstaller --noconfirm --clean GastroMedPro-mac.spec

      - name: Probar el programa (flujo completo)
        env:
          GM_LICENCIA_CLAVE: ${{ secrets.GM_LICENCIA_CLAVE }}
        run: python build/smoke_exe.py build/dist/GastroMedPro

      - name: Empaquetar (zip que conserva el permiso de ejecución)
        run: |
          mkdir -p "paquete/${{ matrix.nombre }}"
          cp build/dist/GastroMedPro "paquete/${{ matrix.nombre }}/GastroMedPro"
          cp build/LEEME-mac.txt "paquete/${{ matrix.nombre }}/LEEME.txt"
          chmod +x "paquete/${{ matrix.nombre }}/GastroMedPro"
          ditto -c -k --keepParent "paquete/${{ matrix.nombre }}" "${{ matrix.nombre }}.zip"

      - name: Guardar el paquete
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}.zip
          retention-days: 30

  publicar:
    # Solo desde «main». La versión de Windows es obligatoria; las de Mac se agregan si salieron bien.
    needs: [windows, mac]
    if: ${{ always() && needs.windows.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: descargas

      - name: Publicar versión descargable (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('app/__init__.py', encoding='utf-8').read()).group(1))")
          TAG="v${VER}-${GITHUB_RUN_NUMBER}"
          FILES="descargas/GastroMedPro-exe/GastroMedPro.exe"
          NOTAS="Probado automáticamente: pruebas del programa y flujo completo (configuración inicial, paciente, nota, receta PDF, respaldo). Windows: descargue GastroMedPro.exe."
          for z in descargas/GastroMedPro-Mac-*/*.zip; do
            [ -f "$z" ] && FILES="$FILES $z"
          done
          if ls descargas/GastroMedPro-Mac-*/*.zip >/dev/null 2>&1; then
            NOTAS="$NOTAS Mac: descargue GastroMedPro-Mac-chip-Apple.zip (M1 a M4) o GastroMedPro-Mac-Intel.zip y lea LEEME.txt."
          fi
          gh release create "$TAG" $FILES --title "GastroMed Pro ${VER} (compilación ${GITHUB_RUN_NUMBER})" --notes "$NOTAS"
